# AnyRouter Pool + NewAPI - 完整版配置 v2.1
# 包含 AnyRouter Pool 和 NewAPI，适合需要用户管理和计费的场景
#
# v2.1 新特性:
# - 站点优先降级: 先换站点再换模型
# - 快速失败: 所有资源不可用时立即返回
# - 半开状态: 冷却期后渐进式恢复
# - 冷却抖动: 防止惊群效应
# - 模型降级: 负载过高时自动切换
#
# 使用方法:
#   docker compose -f docker-compose.full.yml up -d
#
# 访问地址:
#   - NewAPI 管理界面: http://localhost:13000
#   - AnyRouter Pool 管理界面: http://localhost:18081

services:
  # ============================================
  # NewAPI - API 网关（用户管理、计费、多渠道路由）
  # ============================================
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    ports:
      - "${NEWAPI_PORT:-13000}:3000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SERVER_ADDRESS=${SERVER_ADDRESS:-}
      - SESSION_SECRET=${SESSION_SECRET:-anyrouter-pool-session-secret}
      # 代理配置（用于访问外部 OAuth 等）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTP_PROXY:-}
    volumes:
      - ./data/new-api:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - anyrouter-network
    depends_on:
      anyrouter-pool:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ============================================
  # AnyRouter Pool - 多账号聚合管理 v2.1
  # 高可用架构: 站点优先降级 + 快速失败 + 半开恢复
  # ============================================
  anyrouter-pool:
    build:
      context: ./src
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTP_PROXY:-}
    image: anyrouter-pool:latest
    container_name: anyrouter-pool
    restart: always
    ports:
      - "${POOL_PORT:-18081}:18081"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ANYROUTER_BASE_URL=https://anyrouter.top
      - ACCOUNTS_FILE=/app/data/accounts.json
      - BALANCES_FILE=/app/data/balances.json

      # ============ 签到配置 ============
      - CHECKIN_ENABLED=${CHECKIN_ENABLED:-true}
      - CHECKIN_CRON_HOUR=${CHECKIN_CRON_HOUR:-2,8,14,20}
      - CHECKIN_CRON_MINUTE=${CHECKIN_CRON_MINUTE:-30}
      - CHECKIN_MAX_RETRIES=${CHECKIN_MAX_RETRIES:-3}
      - CHECKIN_RETRY_DELAY=${CHECKIN_RETRY_DELAY:-3}

      # ============ NewAPI 集成（完整版默认开启认证）============
      - NEWAPI_URL=http://new-api:3000
      - DASHBOARD_AUTH_ENABLED=${DASHBOARD_AUTH_ENABLED:-true}
      - API_KEY_VALIDATION_ENABLED=${API_KEY_VALIDATION_ENABLED:-true}

      # ============ 主站优先恢复 v2.1 ============
      - PRIMARY_SITE_CHECK_ENABLED=${PRIMARY_SITE_CHECK_ENABLED:-true}
      - PRIMARY_SITE_CHECK_INTERVAL=${PRIMARY_SITE_CHECK_INTERVAL:-5}
      - PRIMARY_SITE_CHECK_INTERVAL_URGENT=${PRIMARY_SITE_CHECK_INTERVAL_URGENT:-1}
      - PRIMARY_SITE_CHECK_REQUIRED_SUCCESSES=${PRIMARY_SITE_CHECK_REQUIRED_SUCCESSES:-2}

      # ============ 站点管理器配置 v2.1 ============
      - SITE_MANAGER_ENABLED=${SITE_MANAGER_ENABLED:-true}
      - SITE_MAX_CONSECUTIVE_FAILS=${SITE_MAX_CONSECUTIVE_FAILS:-5}
      - SITE_COOLDOWN_SECONDS=${SITE_COOLDOWN_SECONDS:-60}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-50}
      - GC_INTERVAL_SECONDS=${GC_INTERVAL_SECONDS:-300}
      - SITE_ALERT_ENABLED=${SITE_ALERT_ENABLED:-true}
      - SITE_ALERT_COOLDOWN=${SITE_ALERT_COOLDOWN:-300}

      # ============ 模型降级配置 v2.1 ============
      - MODEL_DEGRADATION_ENABLED=${MODEL_DEGRADATION_ENABLED:-true}
      - MODEL_DEGRADATION_THRESHOLD=${MODEL_DEGRADATION_THRESHOLD:-3}
      - MODEL_DEGRADATION_COOLDOWN=${MODEL_DEGRADATION_COOLDOWN:-300}
      - MODEL_AUTO_REPLACE_ENABLED=${MODEL_AUTO_REPLACE_ENABLED:-true}
      - MODEL_IMMEDIATE_COOLDOWN=${MODEL_IMMEDIATE_COOLDOWN:-30}

      # ============ 降级策略配置 v2.1 ============
      - DEGRADATION_STRATEGY=${DEGRADATION_STRATEGY:-site_first}
      - MAX_MODEL_FALLBACKS=${MAX_MODEL_FALLBACKS:-3}
      - ALLOW_CROSS_TIER_FALLBACK=${ALLOW_CROSS_TIER_FALLBACK:-true}

      # ============ 快速失败配置 v2.1 ============
      - FAST_FAIL_ENABLED=${FAST_FAIL_ENABLED:-true}

      # ============ 熔断器半开状态 v2.1 ============
      - HALF_OPEN_ENABLED=${HALF_OPEN_ENABLED:-true}
      - SITE_HALF_OPEN_DURATION=${SITE_HALF_OPEN_DURATION:-30}
      - SITE_HALF_OPEN_PASS_RATE=${SITE_HALF_OPEN_PASS_RATE:-0.1}
      - SITE_HALF_OPEN_REQUIRED_SUCCESSES=${SITE_HALF_OPEN_REQUIRED_SUCCESSES:-3}

      # ============ 冷却时间抖动 v2.1 ============
      - COOLDOWN_JITTER_ENABLED=${COOLDOWN_JITTER_ENABLED:-true}
      - COOLDOWN_JITTER_MAX=${COOLDOWN_JITTER_MAX:-10}

      # ============ 代理配置 ============
      - HTTP_PROXY=${HTTP_PROXY:-}

      # ============ 邮件通知配置 ============
      - EMAIL_NOTIFY_ENABLED=${EMAIL_NOTIFY_ENABLED:-false}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-smtp.163.com}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-465}
      - EMAIL_SENDER=${EMAIL_SENDER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_RECEIVER=${EMAIL_RECEIVER:-}

    volumes:
      - ./data/pool:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - anyrouter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18081/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

    # ============ 资源限制（防止内存过高）============
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 600M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  anyrouter-network:
    driver: bridge
